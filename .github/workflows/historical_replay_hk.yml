name: MOS Radar HK Historical Replay

on:
  workflow_dispatch:
    inputs:
      backtest_date:
        description: "Historical replay date, e.g. 2022-10-31"
        required: true
        default: "2022-10-31"
      backtest_use_latest:
        description: "Use latest saved HK scan instead of running a fresh scan first"
        required: false
        default: "false"
      dry_run:
        description: "Set true to generate artifacts without sending email"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  historical-replay-hk:
    runs-on: ubuntu-latest
    concurrency:
      group: mos-radar-hk-historical-replay
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HK historical replay
        env:
          MARKET: hk
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          HOLDINGS_TICKERS_HK: ${{ secrets.HOLDINGS_TICKERS_HK }}
          TOP_MOS_COUNT: ${{ vars.TOP_MOS_COUNT }}
          TRAP_COUNT: ${{ vars.TRAP_COUNT }}
          THIN_COUNT: ${{ vars.THIN_COUNT }}
          MAX_TICKERS: ${{ vars.HK_MAX_TICKERS }}
          REQUEST_SLEEP_SECONDS: ${{ vars.REQUEST_SLEEP_SECONDS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RUN_MODE: historical_replay
          BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
          BACKTEST_USE_LATEST: ${{ github.event.inputs.backtest_use_latest }}
        run: python src/main.py

      - name: Upload HK historical replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mos-radar-hk-historical-${{ github.event.inputs.backtest_date }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/results/hk_*.csv
            reports/hk/*.md
