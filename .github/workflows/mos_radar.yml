name: MOS Radar - US - Daily Scanner

on:
  schedule:
    # GitHub Actions cron uses UTC time.
    # US market weekdays only. One pre-market full scan and email per day.
    # 12:31 UTC ~= 08:31 New York during EDT; still pre-market during EST.
    - cron: "31 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mos-radar:
    runs-on: ubuntu-latest
    concurrency:
      group: mos-radar
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore fundamentals cache
        uses: actions/cache@v4
        with:
          path: cache/fundamentals
          key: mos-radar-fundamentals-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mos-radar-fundamentals-${{ runner.os }}-

      - name: Run MOS Radar
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          HOLDINGS_TICKERS: ${{ secrets.HOLDINGS_TICKERS }}
          TOP_MOS_COUNT: ${{ vars.TOP_MOS_COUNT }}
          TRAP_COUNT: ${{ vars.TRAP_COUNT }}
          THIN_COUNT: ${{ vars.THIN_COUNT }}
          MAX_TICKERS: ${{ vars.MAX_TICKERS }}
          REQUEST_SLEEP_SECONDS: ${{ vars.REQUEST_SLEEP_SECONDS }}
          PRICE_SLEEP_SECONDS: ${{ vars.PRICE_SLEEP_SECONDS }}
          USE_FUNDAMENTALS_CACHE: ${{ vars.USE_FUNDAMENTALS_CACHE }}
          FUNDAMENTALS_CACHE_DAYS: ${{ vars.FUNDAMENTALS_CACHE_DAYS }}
          SEND_AFTER_CLOSE: ${{ vars.SEND_AFTER_CLOSE }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || vars.DRY_RUN }}
        run: python src/main.py

      - name: Upload MOS Radar results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mos-radar-current-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/results/*.csv
            reports/*.md
            state/*.csv

      - name: Commit public market state
        if: always()
        run: |
          if [ -f state/mos_market_latest.csv ]; then
            git config user.name "mos-radar-bot"
            git config user.email "bot@example.com"
            git pull --rebase origin main || true
            git add state/mos_market_latest.csv
            git commit -m "update mos radar public state" || echo "No state changes"
            git push
          else
            echo "No public market state file to commit"
          fi
