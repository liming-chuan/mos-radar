name: MOS Radar Daily Scanner

on:
  schedule:
    # GitHub Actions cron uses UTC time.
    # Run on NY market weekdays only. No automatic runs on Saturday or Sunday.
    # Approx NY times during EDT:
    # 08:31 NY -> 12:31 UTC
    # 12:31 NY -> 16:31 UTC
    # 15:31 NY -> 19:31 UTC
    # 18:37 NY -> 22:37 UTC
    - cron: "31 12 * * 1-5"
    - cron: "31 16 * * 1-5"
    - cron: "31 19 * * 1-5"
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: manual or historical_replay"
        required: false
        default: "manual"
      backtest_date:
        description: "Historical replay date, e.g. 2022-10-14"
        required: false
        default: "2022-10-14"
      backtest_use_latest:
        description: "Use latest saved scan instead of running a fresh scan first"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  mos-radar:
    runs-on: ubuntu-latest
    concurrency:
      group: mos-radar
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MOS Radar
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          HOLDINGS_TICKERS: ${{ secrets.HOLDINGS_TICKERS }}
          TOP_MOS_COUNT: ${{ vars.TOP_MOS_COUNT }}
          TRAP_COUNT: ${{ vars.TRAP_COUNT }}
          THIN_COUNT: ${{ vars.THIN_COUNT }}
          MAX_TICKERS: ${{ vars.MAX_TICKERS }}
          REQUEST_SLEEP_SECONDS: ${{ vars.REQUEST_SLEEP_SECONDS }}
          PRICE_SLEEP_SECONDS: ${{ vars.PRICE_SLEEP_SECONDS }}
          SEND_AFTER_CLOSE: ${{ vars.SEND_AFTER_CLOSE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
          BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
          BACKTEST_USE_LATEST: ${{ github.event.inputs.backtest_use_latest }}
        run: python src/main.py
