name: MOS Radar - US - Daily Scanner

on:
  schedule:
    # GitHub Actions cron uses UTC time.
    # US market weekdays. Full scan plus a fallback for the once-daily brief.
    # 12:31 UTC ~= 08:31 New York during EDT; still pre-market during EST.
    - cron: "31 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_value: ${{ steps.scan.outputs.run_value }}
    env:
      MARKET: us
    concurrency:
      group: mos-brief-us
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check latest evidence and repair before delivery
        id: scan
        continue-on-error: true
        run: python src/short_pipeline.py --market "$MARKET" --phase premarket
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-evidence-us
          path: |
            state/*mos_short_*.csv
            state/*mos_short_*.html
            state/*mos_short_term.json
            state/*mos_short_last_good.json
      - name: Save public forward state even when evidence failed
        if: always()
        run: python src/persist_public_state.py --market "$MARKET" --kind short
      - name: Deliver once or show fault; persist claim before SMTP
        if: success()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          DRY_RUN: 'false'
        run: python src/brief_delivery.py --market "$MARKET" --mode premarket --persist
      - name: Fail on invalid scan evidence
        if: always() && steps.scan.outcome != 'success'
        run: exit 1

  value:
    needs: brief
    if: always() && !cancelled() && (github.event_name != 'schedule' || needs.brief.outputs.run_value != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: mos-value-us
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore fundamentals cache
        uses: actions/cache@v4
        with:
          path: cache/fundamentals
          key: mos-radar-fundamentals-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mos-radar-fundamentals-${{ runner.os }}-

      - name: Run MOS Radar
        env:
          DAILY_BRIEF_MANAGED: 'true'
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          HOLDINGS_TICKERS: ${{ secrets.HOLDINGS_TICKERS }}
          TOP_MOS_COUNT: ${{ vars.TOP_MOS_COUNT }}
          TRAP_COUNT: ${{ vars.TRAP_COUNT }}
          THIN_COUNT: ${{ vars.THIN_COUNT }}
          MAX_TICKERS: ${{ vars.MAX_TICKERS }}
          REQUEST_SLEEP_SECONDS: ${{ vars.REQUEST_SLEEP_SECONDS }}
          PRICE_SLEEP_SECONDS: ${{ vars.PRICE_SLEEP_SECONDS }}
          USE_FUNDAMENTALS_CACHE: ${{ vars.USE_FUNDAMENTALS_CACHE }}
          FUNDAMENTALS_CACHE_DAYS: ${{ vars.FUNDAMENTALS_CACHE_DAYS }}
          SEND_AFTER_CLOSE: ${{ vars.SEND_AFTER_CLOSE }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || vars.DRY_RUN }}
        run: python src/main.py

      - name: Upload MOS Radar results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mos-radar-current-results
          if-no-files-found: ignore
          retention-days: 90
          path: |
            data/results/*.csv
            reports/*.md
            reports/us/*.html
            state/*.csv

      - name: Commit public value state
        if: success()
        run: python src/persist_public_state.py --market us --kind value
