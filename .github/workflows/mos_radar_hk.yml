name: MOS Radar - HK - Daily Scanner

on:
  schedule:
    # Hong Kong market weekdays only. One pre-market full scan and email per day.
    # 01:00 UTC = 09:00 Hong Kong time, before the 09:30 market open.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mos-radar-hk:
    runs-on: ubuntu-latest
    concurrency:
      group: mos-radar-hk
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore HK fundamentals cache
        uses: actions/cache@v4
        with:
          path: cache/fundamentals/hk
          key: mos-radar-hk-fundamentals-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mos-radar-hk-fundamentals-${{ runner.os }}-

      - name: Run MOS Radar HK
        env:
          MARKET: hk
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          HOLDINGS_TICKERS_HK: ${{ secrets.HOLDINGS_TICKERS_HK }}
          TOP_MOS_COUNT: ${{ vars.TOP_MOS_COUNT }}
          TRAP_COUNT: ${{ vars.TRAP_COUNT }}
          THIN_COUNT: ${{ vars.THIN_COUNT }}
          MAX_TICKERS: ${{ vars.HK_MAX_TICKERS }}
          REQUEST_SLEEP_SECONDS: ${{ vars.REQUEST_SLEEP_SECONDS }}
          PRICE_SLEEP_SECONDS: ${{ vars.PRICE_SLEEP_SECONDS }}
          USE_FUNDAMENTALS_CACHE: ${{ vars.USE_FUNDAMENTALS_CACHE }}
          FUNDAMENTALS_CACHE_DAYS: ${{ vars.FUNDAMENTALS_CACHE_DAYS }}
          SEND_AFTER_CLOSE: ${{ vars.SEND_AFTER_CLOSE }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || vars.DRY_RUN }}
        run: python src/main.py

      - name: Upload HK MOS Radar results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mos-radar-hk-current-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/results/hk_*.csv
            reports/hk/*.md
            state/hk_*.csv

      - name: Commit HK public market state
        if: always()
        run: |
          if [ -f state/hk_mos_market_latest.csv ]; then
            git config user.name "mos-radar-bot"
            git config user.email "bot@example.com"
            git pull --rebase origin main || true
            git add state/hk_mos_market_latest.csv
            git commit -m "update hk mos radar public state" || echo "No HK state changes"
            git push
          else
            echo "No HK public market state file to commit"
          fi
