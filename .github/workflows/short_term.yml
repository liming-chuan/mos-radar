name: MOS Radar - Short-term research

on:
  schedule:
    # After close: research plus the next-session daily brief; no broker access.
    - cron: '23 9 * * 1-5'
    - cron: '37 21 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [hk, us]
        default: hk

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET: ${{ inputs.market || (github.event.schedule == '23 9 * * 1-5' && 'hk' || 'us') }}
    concurrency:
      group: mos-radar-${{ inputs.market || (github.event.schedule == '23 9 * * 1-5' && 'hk' || 'us') }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate public short-term plans and advance forward ledger
        id: scan
        continue-on-error: true
        run: python src/short_term_scan.py --market "$MARKET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-term-${{ env.MARKET }}
          path: |
            state/*mos_short_*.csv
            state/*mos_short_*.html
            state/*mos_short_term.json
            state/*mos_short_last_good.json
      - name: Save forward research state
        if: always()
        run: |
          prefix=""
          if [ "$MARKET" = hk ]; then prefix="hk_"; fi
          git config user.name mos-radar-bot
          git config user.email bot@example.com
          if [ -f "state/${prefix}mos_short_term.json" ]; then
            git add "state/${prefix}mos_short_term.json"
          fi
          if [ -f "state/${prefix}mos_short_last_good.json" ]; then
            git add "state/${prefix}mos_short_last_good.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "update $MARKET short-term research state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Send next-session brief once
        id: delivery
        if: success() && steps.scan.outcome == 'success' && github.event_name == 'schedule'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || vars.DRY_RUN }}
        run: python src/brief_delivery.py --market "$MARKET" --mode after-close
      - name: Persist delivery receipt immediately
        if: always() && steps.delivery.outcome == 'success'
        run: |
          prefix=""
          if [ "$MARKET" = hk ]; then prefix="hk_"; fi
          receipt="state/${prefix}mos_brief_delivery.json"
          if [ -f "$receipt" ]; then
            git add "$receipt"
            if ! git diff --cached --quiet; then
              git commit -m "record $MARKET daily brief delivery"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Fail on invalid scan evidence
        if: always() && steps.scan.outcome != 'success'
        run: exit 1
