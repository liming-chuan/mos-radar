name: MOS Radar - Short-term research

on:
  schedule:
    # Primary after-close and later recovery waves; UTC, holiday-aware in code.
    - cron: '23 9 * * 1-5'
    - cron: '41 13 * * 1-5'
    - cron: '37 21 * * 1-5'
    - cron: '17 6 * * 2-6'
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [hk, us]
        default: hk
      force_scan:
        description: Force another rotation even if current data are healthy (no email)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET: ${{ inputs.market || ((github.event.schedule == '23 9 * * 1-5' || github.event.schedule == '41 13 * * 1-5') && 'hk' || 'us') }}
    concurrency:
      group: mos-brief-${{ inputs.market || ((github.event.schedule == '23 9 * * 1-5' || github.event.schedule == '41 13 * * 1-5') && 'hk' || 'us') }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh incomplete evidence; retain failed cohort for recovery
        id: scan
        continue-on-error: true
        env:
          FORCE_SCAN: ${{ inputs.force_scan }}
        run: |
          args=()
          if [ "$FORCE_SCAN" = true ]; then args+=(--force); fi
          python src/short_pipeline.py --market "$MARKET" --phase recovery "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-term-${{ env.MARKET }}
          path: |
            state/*mos_short_*.csv
            state/*mos_short_*.html
            state/*mos_short_term.json
            state/*mos_short_last_good.json
      - name: Save public forward state even when evidence failed
        if: always()
        run: python src/persist_public_state.py --market "$MARKET" --kind short
      - name: Send next-session brief with durable pre-send claim
        if: success() && steps.scan.outcome == 'success' && github.event_name == 'schedule'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          DRY_RUN: 'false'
        run: python src/brief_delivery.py --market "$MARKET" --mode after-close --persist
      - name: Fail on invalid scan evidence
        if: always() && steps.scan.outcome != 'success'
        run: exit 1
