name: MOS Radar - Regression Tests
on:
  push:
    paths: ["src/**", "tests/**", "data/hk_statement_evidence.json", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "data/hk_statement_evidence.json", "requirements.txt", ".github/workflows/tests.yml"]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
